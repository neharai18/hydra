<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYDRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1f5c6e;
  --ink-soft: #4f8294;
  --water-light: #6fc6e0;
  --water-deep: #1e7a9c;
  --glass-strong: rgba(255, 255, 255, 0.78);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Nunito Sans', sans-serif;
  background: linear-gradient(160deg, #b8c9d4 0%, #9fb3c2 30%, #7f98ac 65%, #5f7a91 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.glow { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.45; pointer-events: none; }
.glow-warm  { width: 200px; height: 200px; top: 15%; left: 70%; background: #ffd9a0; }
.glow-green { width: 240px; height: 240px; bottom: -40px; left: -40px; background: #a8c9d9; }
.glow-city  { width: 160px; height: 160px; bottom: 10%; right: 5%; background: #ffe8c2; opacity: 0.35; }

.dew { position: absolute; z-index: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,1), rgba(255,255,255,0.4) 50%, rgba(140,200,220,0.3) 80%);
  box-shadow: 0 1px 3px rgba(20,40,60,0.3), inset 0 -2px 3px rgba(30,90,110,0.2);
  animation: dewWobble 9s ease-in-out infinite;
}
@keyframes dewWobble { 0%,100%{transform:translate(0,0);} 50%{transform:translate(1px,2px);} }

.slide-drop { position:absolute; z-index: 0; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,1), rgba(255,255,255,0.45) 55%);
  box-shadow: 0 1px 3px rgba(20,40,60,0.25);
  animation: slideDown linear infinite;
}
.slide-drop::after { content:""; position:absolute; top:-40px; left:50%; width:2px; height:40px; transform:translateX(-50%);
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5));
}
@keyframes slideDown { 0%{transform:translateY(0); opacity:0;} 8%{opacity:0.9;} 90%{opacity:0.5;} 100%{transform:translateY(160px); opacity:0;} }

.dw1{width:10px;height:10px;top:8%;left:10%;}
.dw2{width:6px;height:6px;top:15%;left:28%;animation-delay:1.5s;}
.dw3{width:14px;height:14px;top:30%;left:6%;animation-delay:.8s;}
.dw4{width:7px;height:7px;top:60%;left:4%;animation-delay:2.2s;}
.dw5{width:9px;height:9px;top:75%;left:22%;animation-delay:1s;}
.dw6{width:11px;height:11px;top:12%;right:8%;animation-delay:.4s;}
.dw7{width:6px;height:6px;top:40%;right:5%;animation-delay:1.8s;}
.dw8{width:13px;height:13px;top:68%;right:12%;animation-delay:2.5s;}
.dw9{width:8px;height:8px;top:85%;right:25%;animation-delay:.6s;}
.dw10{width:5px;height:5px;top:5%;left:45%;animation-delay:1.1s;}
.dw11{width:12px;height:12px;top:22%;left:50%;animation-delay:2.8s;}
.dw12{width:7px;height:7px;top:48%;left:35%;animation-delay:.3s;}
.dw13{width:9px;height:9px;top:55%;left:60%;animation-delay:1.6s;}
.dw14{width:6px;height:6px;top:88%;left:48%;animation-delay:2.1s;}
.dw15{width:10px;height:10px;top:5%;right:30%;animation-delay:.9s;}
.dw16{width:8px;height:8px;top:92%;right:40%;animation-delay:1.4s;}

.sl1{width:5px;height:5px;top:0%;left:18%;animation-duration:8s;}
.sl2{width:4px;height:4px;top:0%;left:65%;animation-duration:11s;animation-delay:3s;}
.sl3{width:6px;height:6px;top:0%;left:40%;animation-duration:9.5s;animation-delay:5s;}
.sl4{width:5px;height:5px;top:0%;left:85%;animation-duration:10s;animation-delay:1.5s;}
.sl5{width:4px;height:4px;top:0%;left:8%;animation-duration:9s;animation-delay:4s;}
.sl6{width:5px;height:5px;top:0%;left:25%;animation-duration:7.5s;animation-delay:2.2s;}
.sl7{width:3px;height:3px;top:0%;left:52%;animation-duration:12s;animation-delay:.5s;}
.sl8{width:6px;height:6px;top:0%;left:75%;animation-duration:8.8s;animation-delay:4.5s;}
.sl9{width:4px;height:4px;top:0%;left:92%;animation-duration:10.5s;animation-delay:2.8s;}
.sl10{width:5px;height:5px;top:0%;left:33%;animation-duration:9.2s;animation-delay:6s;}

.card {
  position: relative; z-index: 1; width: 320px; padding: 34px 30px 30px;
  background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 26px;
  box-shadow: 0 16px 40px rgba(20,40,60,0.25), 0 2px 8px rgba(20,40,60,0.1);
  text-align: center;
  animation: cardFloat 7s ease-in-out infinite;
}
@keyframes cardFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

.top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
.card-head { display: flex; align-items: center; gap: 7px; }
.logo-drop { font-size: 1.2em; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
h1 { font-family:'Comfortaa',cursive; font-weight:700; font-size:1.4em; color:var(--ink); margin:0; }
.date-chip { font-size:0.72em; color:var(--ink-soft); background:rgba(255,255,255,0.5); padding:4px 10px; border-radius:20px; }

.greeting { font-size: 0.95em; color: var(--ink); font-weight: 700; margin: 10px 0 0; text-align: left; }
.tagline { font-family:'Caveat',cursive; font-size: 1.15em; color: var(--ink-soft); margin: 0 0 20px; text-align: left; }

.jug-wrap { margin: 6px auto 20px; width: 108px; height: 142px; position: relative; }
.jug-neck { position:absolute; top:-13px; left:34px; width:38px; height:17px; border:3px solid var(--glass-strong); border-bottom:none; border-radius:8px 8px 0 0; background:rgba(255,255,255,0.35); }
.jug-body { width:100%; height:100%; border:3px solid var(--glass-strong); border-radius:13px 13px 36px 36px; background:rgba(255,255,255,0.3); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.water { position:absolute; bottom:0; left:0; width:100%; height:{{ percentage }}%; background:linear-gradient(180deg,var(--water-light),var(--water-deep)); transition:height .9s cubic-bezier(.4,1.4,.6,1); }
.wave { position:absolute; top:-6px; left:0; width:200%; height:12px; background:radial-gradient(circle, rgba(255,255,255,0.55) 45%, transparent 50%); background-size:22px 12px; animation:waveMove 3s linear infinite; }
@keyframes waveMove { from{transform:translateX(0);} to{transform:translateX(-22px);} }
.jug-pct { position:relative; z-index:2; font-weight:700; font-size:1.25em; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.18); }

.stats-row { display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:12px; }
.stat { display:flex; flex-direction:column; gap:2px; }
.stat-label { font-size:0.7em; color:var(--ink-soft); }
.stat-value { font-size:1.02em; font-weight:700; color:var(--ink); }
.stat-divider { width:1px; height:26px; background:rgba(31,92,110,0.18); }

.message { margin:0 0 18px; font-size:0.9em; color:var(--ink); font-weight:600; }

.quick-add { display:flex; justify-content:center; gap:9px; }
.add-btn { font-family:'Nunito Sans',sans-serif; font-weight:700; font-size:0.86em; color:var(--ink); background:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.6); padding:10px 15px; border-radius:14px; cursor:pointer; text-decoration:none; display:inline-block; transition:transform .2s ease, background .2s ease, box-shadow .2s ease; }
.add-btn:hover { background:rgba(255,255,255,0.8); transform:translateY(-3px); box-shadow:0 8px 18px rgba(20,40,60,0.2); }

.rise-drop { position:fixed; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, var(--water-light) 70%); pointer-events:none; animation:riseUp 1s ease-out forwards; z-index:5; }
@keyframes riseUp { 0%{transform:translateY(0) scale(1); opacity:.9;} 100%{transform:translateY(-90px) scale(.3); opacity:0;} }

@media (prefers-reduced-motion: reduce) { .dew,.slide-drop,.card,.logo-drop,.wave,.add-btn,.rise-drop{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<div class="glow glow-warm"></div>
<div class="glow glow-green"></div>
<div class="glow glow-city"></div>

<span class="dew dw1"></span><span class="dew dw2"></span><span class="dew dw3"></span><span class="dew dw4"></span><span class="dew dw5"></span><span class="dew dw6"></span><span class="dew dw7"></span><span class="dew dw8"></span><span class="dew dw9"></span>
<span class="dew dw10"></span><span class="dew dw11"></span><span class="dew dw12"></span><span class="dew dw13"></span><span class="dew dw14"></span><span class="dew dw15"></span><span class="dew dw16"></span>

<span class="slide-drop sl1"></span><span class="slide-drop sl2"></span><span class="slide-drop sl3"></span><span class="slide-drop sl4"></span><span class="slide-drop sl5"></span>
<span class="slide-drop sl6"></span><span class="slide-drop sl7"></span><span class="slide-drop sl8"></span><span class="slide-drop sl9"></span><span class="slide-drop sl10"></span>

<main class="card">
  <div class="top-row">
    <div class="card-head"><span class="logo-drop">💧</span><h1>HYDRA</h1></div>
    <span class="date-chip">{{ today_date }}</span>
  </div>
  <p class="greeting">{{ greeting }} 👋</p>
  <p class="tagline">stay fresh, stay you</p>

  <div class="jug-wrap">
    <div class="jug-neck"></div>
    <div class="jug-body">
      <div class="water"><div class="wave"></div></div>
      <span class="jug-pct">{{ percentage }}%</span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><span class="stat-label">consumed</span><span class="stat-value">{{ today_total }}ml</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-label">goal</span><span class="stat-value">{{ daily_goal }}ml</span></div>
  </div>

  <p class="message">
    {% if percentage >= 100 %}you did it today 💧{% else %}{{ daily_goal - today_total }}ml to go{% endif %}
  </p>

  <div class="quick-add">
    <a href="/log/250" class="add-btn">+250</a>
    <a href="/log/500" class="add-btn">+500</a>
    <a href="/log/750" class="add-btn">+750</a>
  </div>
</main>

<script>
document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.getAttribute('href');
    const rect = this.getBoundingClientRect();
    for (let i = 0; i < 3; i++) {
      const drop = document.createElement('span');
      drop.className = 'rise-drop';
      drop.style.left = (rect.left + rect.width/2 + (i-1)*10) + 'px';
      drop.style.top = rect.top + 'px';
      drop.style.animationDelay = (i*0.08) + 's';
      document.body.appendChild(drop);
    }
    setTimeout(() => window.location.href = href, 350);
  });
});
</script>
</body>
</html>
